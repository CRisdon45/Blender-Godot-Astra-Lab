name: Public compact foliage shoot proof
on:
  push:
    branches: [ci/yardscape-renderer-slice]
    paths: ['ci/yardscape-shoot-probe/**', '.github/workflows/yardscape-public-shoot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compact-shoot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shoot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/yardscape-renderer
            ci/yardscape-spatial-probe
            ci/yardscape-shoot-probe
      - name: Verify limited reviewed source
        run: python ci/yardscape-shoot-probe/run_shoot.py --verify-only
      - name: Install exact retained Godot
        run: python ci/yardscape-renderer/install_godot.py
      - name: Native compact shoot look
        run: python ci/yardscape-shoot-probe/run_shoot.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compact-shoot-evidence
          path: ${{ runner.temp }}/shoot-evidence
          retention-days: 7
          if-no-files-found: warn
