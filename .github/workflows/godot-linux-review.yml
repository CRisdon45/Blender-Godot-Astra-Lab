name: Godot Linux visual review

on:
  workflow_dispatch:
  push:
    branches: [work/courtyard-review-pass]
    paths: [.github/workflows/godot-linux-review.yml]

permissions:
  contents: read

concurrency:
  group: godot-linux-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.1
      # Official godotengine/godot-builds release asset 476992009 digest.
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      LIBGL_ALWAYS_SOFTWARE: "true"
      LP_NUM_THREADS: "4"
    steps:
      - name: Check out the requested branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve source identity and existing reference images
        run: |
          mkdir -p render-output/baseline render-output/source
          git rev-parse HEAD > render-output/source-commit.txt
          cp godot/captures/godot_courtyard.png render-output/baseline/
          cp pool_recreation.png render-output/baseline/
          printf '%s\n' 'Baseline images predate the current water/navigation work.' > render-output/baseline/README.txt
          git ls-files -z '*.gd' '*.gdshader' '*.py' '*.md' '*.yml' 'godot/project.godot' '.gitignore' | tar --null -T - -cf render-output/source/source-text.tar
      - name: Install software Vulkan and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libvulkan1 mesa-vulkan-drivers vulkan-tools unzip
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
      - name: Install the repository baseline Godot release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 2 --max-time 180 "$BASE/$ZIP" --output "$ZIP"
          printf '%s  %s\n' "$GODOT_SHA256" "$ZIP" | sha256sum --check --strict
          unzip -q "$ZIP"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Run Python regression tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee render-output/python-tests.log
      - name: Capture the saved courtyard with the real Forward+ renderer
        id: review
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1600x1200x24' bash -c '
            vulkaninfo --summary > render-output/vulkan-info.txt 2>&1
            python3 tools/review.py --godot godot --scene editable --water on --timeout 600 --output "$GITHUB_WORKSPACE/render-output/review"
          ' 2>&1 | tee render-output/review-console.log
      - name: Diagnose failed engine gate without declaring success
        if: failure() && steps.review.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          output = Path('render-output/diagnostics')
          output.mkdir(parents=True, exist_ok=True)
          results = []
          commands = [
              (str(p.relative_to('godot')).replace('/', '_'),
               ['godot', '--headless', '--path', 'godot', '--check-only', '--script',
                'res://' + str(p.relative_to('godot'))])
              for p in sorted(Path('godot').rglob('*.gd'))
          ]
          commands += [
              ('runtime-' + name, ['godot', '--headless', '--path', 'godot', '--script',
                                 'res://tests/' + name])
              for name in ('test_navigation.gd', 'test_water_interaction.gd', 'test_scene_water.gd')
          ]
          for name, command in commands:
              try:
                  proc = subprocess.run(command, capture_output=True, text=True, timeout=35)
                  text = proc.stdout + '\n' + proc.stderr
                  code = proc.returncode
              except subprocess.TimeoutExpired as exc:
                  def decode(value):
                      return value.decode('utf-8', 'replace') if isinstance(value, bytes) else value or ''
                  text = decode(exc.stdout) + decode(exc.stderr) + '\nDIAGNOSTIC_TIMEOUT\n'
                  code = 124
              (output / (name + '.log')).write_text(text)
              results.append({'name': name, 'command': command, 'exit_code': code})
              print(name, 'exit', code)
              print(text[-10000:])
          (output / 'results.json').write_text(json.dumps(results, indent=2))
          PY
      - name: Record final workspace state and scope
        if: always()
        run: |
          git status --short > render-output/workspace-status.txt
          printf '%s\n' \
            'Requested renderer: Godot 4.7.1 Forward+ on Linux with Mesa software Vulkan.' \
            'Not a desktop GPU or Android performance benchmark.' \
            'Fresh captures, when successful, are under review/. Baseline/ images are older.' \
            'Diagnostics never override a failed review gate.' \
            'No Blender regeneration, editable-scene save, or tracked baseline replacement.' \
            > render-output/README.txt
          echo '## Godot Linux visual review' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the godot-linux-review artifact for images and diagnostic logs. Consult runner-report.json: an uploaded artifact alone does not establish a passing review.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload images and diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: godot-linux-review-${{ github.run_number }}
          path: render-output/
          if-no-files-found: error
          retention-days: 3
