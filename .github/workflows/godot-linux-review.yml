name: Godot Linux visual review

on:
  workflow_dispatch:
  push:
    branches: [work/courtyard-review-pass]
    paths: [.github/workflows/godot-linux-review.yml]

permissions:
  contents: read

concurrency:
  group: godot-linux-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.1
      LIBGL_ALWAYS_SOFTWARE: "true"
      LP_NUM_THREADS: "4"
    steps:
      - name: Check out the requested branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve source identity and existing reference images
        run: |
          mkdir -p render-output/baseline
          git rev-parse HEAD > render-output/source-commit.txt
          cp godot/captures/godot_courtyard.png render-output/baseline/
          cp pool_recreation.png render-output/baseline/
          printf '%s\n' 'Baseline images predate the current water/navigation work.' > render-output/baseline/README.txt
      - name: Install software Vulkan and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libvulkan1 mesa-vulkan-drivers vulkan-tools unzip
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
      - name: Install the repository baseline Godot release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 2 --max-time 180 "$BASE/$ZIP" --output "$ZIP"
          curl --fail --location --retry 2 --max-time 60 "$BASE/SHA256-SUMS.txt" --output SHA256-SUMS.txt
          grep -F "$ZIP" SHA256-SUMS.txt > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum --check selected.sha256
          unzip -q "$ZIP"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Run Python regression tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee render-output/python-tests.log
      - name: Capture the saved courtyard with the real Forward+ renderer
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1600x1200x24' bash -c '
            vulkaninfo --summary > render-output/vulkan-info.txt 2>&1
            python3 tools/review.py --godot godot --scene editable --water on --timeout 600 --output "$GITHUB_WORKSPACE/render-output/review"
          ' 2>&1 | tee render-output/review-console.log
      - name: Record final workspace state and scope
        if: always()
        run: |
          git status --short > render-output/workspace-status.txt
          printf '%s\n' \
            'Actual Godot 4.7.1 Forward+ rendering on Linux with Mesa software Vulkan.' \
            'Not a desktop GPU or Android performance benchmark.' \
            'Fresh captures, when successful, are under review/. Baseline/ images are older.' \
            'No Blender regeneration, editable-scene save, or tracked baseline replacement.' \
            > render-output/README.txt
          echo '## Godot Linux visual review' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the godot-linux-review artifact for images and diagnostic logs. Consult runner-report.json: an uploaded artifact alone does not establish a passing review.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload images and diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-review-${{ github.run_number }}
          path: render-output/
          if-no-files-found: error
          retention-days: 3
