name: Three.js Palo Verde authored-volume LOD0 review
on:
  workflow_dispatch:
  push:
    branches: [work/threejs-palo-verde-gold]
    paths:
      - threejs_palo_verde/authored_volume.html
      - threejs_palo_verde/src/main_authored_volume.js
      - threejs_palo_verde/src/tree_authored_volume.js
      - threejs_palo_verde/src/palo_verde_authored_template.js
      - threejs_palo_verde/src/painted_foliage_atlas.js
      - .github/workflows/threejs-palo-verde-authored-volume-review.yml
permissions:
  contents: read
concurrency:
  group: threejs-palo-authored-volume-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - name: Validate authored-volume source and start study
        run: |
          set -euo pipefail
          mkdir -p threejs-output
          git rev-parse HEAD > threejs-output/source-commit.txt
          node --check threejs_palo_verde/src/palo_verde_authored_template.js
          node --check threejs_palo_verde/src/painted_foliage_atlas.js
          node --check threejs_palo_verde/src/tree_authored_volume.js
          node --check threejs_palo_verde/src/main_authored_volume.js
          node --input-type=module - <<'NODE'
          import {DESERT_MUSEUM_HERO_TEMPLATE as t,validateHeroTemplate} from './threejs_palo_verde/src/palo_verde_authored_template.js';
          validateHeroTemplate(t);if(t.leaders.length!==3||t.scaffolds.length!==11||t.canopyRegions.length!==18)throw new Error('authored composition contract changed');
          NODE
          python3 -m http.server 8123 --directory threejs_palo_verde >threejs-output/server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/authored_volume.html >/dev/null && break; sleep .2; done
          if command -v google-chrome >/dev/null; then echo "BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"; elif command -v chromium >/dev/null; then echo "BROWSER=$(command -v chromium)" >> "$GITHUB_ENV"; else exit 2; fi
      - name: Render five authored-volume LOD0 views
        run: |
          set -euo pipefail
          FLAGS=(--headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --window-size=1280,800 --hide-scrollbars --virtual-time-budget=12000)
          for VIEW in hero side low elevated reverse; do timeout 45 "$BROWSER" "${FLAGS[@]}" --screenshot="threejs-output/${VIEW}.png" "http://127.0.0.1:8123/authored_volume.html?capture=1&view=${VIEW}" >"threejs-output/${VIEW}.stdout.log" 2>"threejs-output/${VIEW}.stderr.log"; done
          timeout 45 "$BROWSER" "${FLAGS[@]}" --dump-dom "http://127.0.0.1:8123/authored_volume.html?capture=1&view=hero" > threejs-output/dom.html 2>threejs-output/dom.stderr.log
      - name: Validate browser output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html,json,re,struct
          root=Path('threejs-output');dom=(root/'dom.html').read_text(errors='replace');assert 'data-ready="true"' in dom,dom[-3000:]
          m=re.search(r'data-report="([^"]+)"',dom);assert m;r=json.loads(html.unescape(m.group(1)))
          assert r['schema']=='threejs-palo-verde/7' and r['authoredTemplate'] is True and r['hybridCanopy'] is True and r['clusteredOpaqueLobes'] is True,r
          assert r['leaders']==3 and r['heroScaffolds']==11 and r['authoredCanopyRegions']==18,r
          assert r['coreRegions']==18 and r['coreLobes']>=60 and r['edgeCards']>=35,r
          assert r['foliageMasses']==r['coreLobes']+r['edgeCards'] and r['triangles']<=r['triangleHardCap'],r
          assert abs(r['scaffoldVisibleFraction']-.80)<1e-9,r
          assert r['atlasRepresentation']=='continuous_irregular_brush_cloud' and r['paintedToneAtlas'] is True,r
          for name in ('hero','side','low','elevated','reverse'):
              raw=(root/f'{name}.png').read_bytes();assert raw[:8]==b'\x89PNG\r\n\x1a\n' and len(raw)>30000,(name,len(raw));w,h=struct.unpack('>II',raw[16:24]);assert(w,h)==(1280,800)
          (root/'runtime-report.json').write_text(json.dumps(r,indent=2));print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: threejs-palo-authored-volume-${{ github.run_number }}-${{ github.run_attempt }}
          path: threejs-output/
          retention-days: 7
          if-no-files-found: error
