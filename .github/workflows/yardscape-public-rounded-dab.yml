name: Public rounded dab component proof
on:
  push:
    branches: [ci/yardscape-renderer-slice]
    paths: ['ci/yardscape-rounded-dab-probe/**', '.github/workflows/yardscape-public-rounded-dab.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rounded-dab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rounded:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/yardscape-renderer
            ci/yardscape-spatial-probe
            ci/yardscape-foliage-group-probe
            ci/yardscape-dab-group-probe
            ci/yardscape-rounded-dab-probe
      - name: Verify reviewed component boundary
        run: python ci/yardscape-rounded-dab-probe/run_rounded.py --verify-only
      - name: Install exact retained Godot
        run: python ci/yardscape-renderer/install_godot.py
      - name: Retained dab-group regression
        run: python ci/yardscape-dab-group-probe/run_dab.py
      - name: Native rounded component comparison
        run: python ci/yardscape-rounded-dab-probe/run_rounded.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rounded-dab-evidence
          path: ${{ runner.temp }}/rounded-dab-evidence
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rounded-dab-baseline-regression
          path: ${{ runner.temp }}/dab-group-evidence
          retention-days: 7
          if-no-files-found: warn
