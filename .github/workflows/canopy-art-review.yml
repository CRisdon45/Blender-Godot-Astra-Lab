name: Canopy art research - Blender and Godot VM review
on:
  workflow_dispatch:
  push:
    branches: [work/plant-canopy-art-study]
    paths:
      - .github/workflows/canopy-art-review.yml
      - tools/**
      - plant_lab/**
      - tests/test_plant_*.py
      - tests/test_species_*.py
permissions:
  contents: read
concurrency:
  group: canopy-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      LP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified engines
        run: |
          set -euo pipefail
          mkdir -p canopy-output "$RUNNER_TEMP/engines" "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          git rev-parse HEAD > canopy-output/source-commit.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libvulkan1 mesa-vulkan-drivers libxrender1 libxi6 libxxf86vm1 libxfixes3 libxkbcommon0 unzip python3-jsonschema python3-pil python3-numpy
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/engines"
          curl -fL --retry 2 --max-time 180 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  godot.zip' | sha256sum --check --strict
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          BASE=https://download.blender.org/release/Blender5.2
          curl -fL --retry 2 --max-time 240 "$BASE/blender-5.2.1-linux-x64.tar.xz" -o blender-5.2.1-linux-x64.tar.xz
          curl -fL --retry 2 --max-time 60 "$BASE/blender-5.2.1.sha256" -o blender.sha256
          grep ' blender-5.2.1-linux-x64.tar.xz$' blender.sha256 | sha256sum --check --strict
          tar -xf blender-5.2.1-linux-x64.tar.xz
          echo "$RUNNER_TEMP/engines" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/engines/blender-5.2.1-linux-x64" >> "$GITHUB_PATH"
      - name: Build baseline and new canopy art in Blender
        id: build
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/make_lod_contract.py
          blender --background --factory-startup --python-exit-code 1 --python tools/build_species_lab.py 2>&1 | tee canopy-output/baseline-blender.log
          blender --background --factory-startup --python-exit-code 1 --python tools/build_canopy_study.py 2>&1 | tee canopy-output/canopy-blender.log
          grep -q CANOPY_BLENDER_BUILD_OK canopy-output/canopy-blender.log
          /usr/bin/python3 tools/check_species_assets.py plant_lab/assets > canopy-output/baseline-glb.json
          /usr/bin/python3 tools/check_canopy_assets.py plant_lab > canopy-output/canopy-glb.json
          /usr/bin/python3 - <<'PY' 2>&1 | tee canopy-output/python-tests.log
          import json,pathlib,unittest
          loader=unittest.TestLoader()
          suite=unittest.TestSuite([loader.discover('tests',pattern='test_species_*.py'),loader.discover('tests',pattern='test_plant_*.py')])
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          report={'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skipped':len(result.skipped),'passed':result.wasSuccessful() and not result.skipped}
          pathlib.Path('canopy-output/python-report.json').write_text(json.dumps(report,indent=2))
          assert report['passed'],report
          PY
      - name: Import and execute both runtime test suites
        id: engine
        run: |
          set -euo pipefail
          timeout 240 godot --headless --audio-driver Dummy --path plant_lab --editor --import 2>&1 | tee canopy-output/import.log
          timeout 180 godot --headless --audio-driver Dummy --path plant_lab --script res://engine/tests/plant_runtime_smoke.gd 2>&1 | tee canopy-output/baseline-smoke.log
          timeout 180 godot --headless --audio-driver Dummy --path plant_lab --script res://engine/tests/canopy_smoke.gd 2>&1 | tee canopy-output/canopy-smoke.log
          /usr/bin/python3 - <<'PY'
          import json,re
          from pathlib import Path
          for name in ('import','baseline-smoke','canopy-smoke'):
              log=Path('canopy-output/'+name+'.log').read_text()
              assert not re.search(r'SCRIPT ERROR:|SHADER ERROR:|Shader compilation failed|Parse Error:',log),log
          for name,prefix in [('baseline-smoke','PLANT_FOUNDATION_SMOKE '),('canopy-smoke','CANOPY_SMOKE ')]:
              log=Path('canopy-output/'+name+'.log').read_text()
              report=json.loads(next(line[len(prefix):] for line in log.splitlines() if line.startswith(prefix)))
              Path('canopy-output/'+name+'.json').write_text(json.dumps(report,indent=2))
              assert report['passed'] and not report['failures'],report
          PY
      - name: Capture matched Mobile-renderer views twice
        id: capture
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          for PASS in images repeat-images; do
            xvfb-run -a -s '-screen 0 1280x800x24' timeout 360 godot --audio-driver Dummy --path plant_lab --rendering-method mobile res://canopy_study.tscn -- --capture="$GITHUB_WORKSPACE/canopy-output/$PASS" 2>&1 | tee "canopy-output/$PASS.log"
          done
          /usr/bin/python3 - <<'PY'
          import json,re
          from pathlib import Path
          import numpy as np
          from PIL import Image,ImageStat
          root=Path('canopy-output')
          reports=[]
          for folder in ('images','repeat-images'):
              log=(root/(folder+'.log')).read_text()
              assert 'CANOPY_CAPTURE_DONE' in log,log
              assert not re.search(r'SCRIPT ERROR:|SHADER ERROR:|Shader compilation failed|Parse Error:',log),log
              report=json.loads((root/folder/'capture-report.json').read_text())
              assert report['renderer']=='mobile' and len(report['images'])==22 and not report['errors'],report
              for entry in report['images']:
                  with Image.open(root/folder/entry['file']) as image:
                      image.load()
                      assert image.size==(1280,800)
                      assert max(ImageStat.Stat(image.convert('RGB')).stddev)>3,'blank capture'
                      assert not entry['runtime']['errors'] and not entry['runtime']['preparation_pending']
              reports.append(report)
          differences=[]
          for a,b in zip(reports[0]['images'],reports[1]['images']):
              assert a['file']==b['file'] and a['camera']==b['camera'] and a['sun']==b['sun']
              x=np.asarray(Image.open(root/'images'/a['file']).convert('RGB'),dtype=float)
              y=np.asarray(Image.open(root/'repeat-images'/a['file']).convert('RGB'),dtype=float)
              differences.append({'file':a['file'],'mean_absolute_rgb_error':float(np.abs(x-y).mean()),'maximum_rgb_error':float(np.abs(x-y).max())})
          value={'comparisons':differences,'repeatability_passed':all(d['mean_absolute_rgb_error']<.5 for d in differences),'art_approved':False,'tablet_tested':False}
          (root/'repeatability.json').write_text(json.dumps(value,indent=2))
          assert value['repeatability_passed'],value
          print('CANOPY_MOBILE_REVIEW_OK: not Android GPU certification')
          PY
      - name: Package all sources and unfiltered evidence
        if: always()
        run: |
          mkdir -p canopy-output/bundle/{tools,tests,docs,schemas,authoring}
          cp -r plant_lab canopy-output/bundle/
          rm -rf canopy-output/bundle/plant_lab/.godot
          cp -r tools/plant_engine canopy-output/bundle/tools/
          cp tools/{species_lab_core,build_species_lab,check_species_assets,compile_plant_catalog,make_lod_contract,build_canopy_study,check_canopy_assets}.py canopy-output/bundle/tools/
          cp tests/test_species_*.py tests/test_plant_*.py canopy-output/bundle/tests/
          cp schemas/plant_recipe.schema.json canopy-output/bundle/schemas/
          cp docs/CANOPY_RESEARCH.md canopy-output/bundle/docs/
          cp -r authoring/canopy_study canopy-output/bundle/authoring/ 2>/dev/null || true
          find canopy-output/bundle -type d -name __pycache__ -prune -exec rm -rf {} +
          git status --short > canopy-output/worktree-status.txt
          printf '%s\n' 'Open plant_lab/canopy_study.tscn with Godot 4.7.1 and press F6. Original main scene is retained. Images are actual software-Vulkan captures, not tablet performance proof.' > canopy-output/bundle/START_HERE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canopy-art-${{ github.run_number }}-${{ github.run_attempt }}
          path: canopy-output/
          if-no-files-found: error
          retention-days: 7
