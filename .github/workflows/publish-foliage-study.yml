name: Publish inspected foliage study

on:
  workflow_dispatch:
  push:
    branches: [work/courtyard-review-pass]
    paths: [.github/workflows/publish-foliage-study.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-inspected-foliage
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/work/courtyard-review-pass'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish reviewed binary assets without changing main or original assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, tarfile, urllib.error, urllib.request, zipfile
          REPO = 'CRisdon45/Blender-Godot-Astra-Lab'
          BRANCH = 'work/courtyard-review-pass'
          ARTIFACT = 9964198692
          DIGEST = 'a461fc4ec995fb8af346686526b865ccdde2714f291336af5594c77ecc515b2a'
          SOURCE = '297af30a2d611dbf4437fcafba34770a5be3e731'
          BASE = 'https://api.github.com/repos/' + REPO
          TOKEN = os.environ['GH_TOKEN']
          HEAD = os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + BRANCH

          def api(method, path, data=None):
              request = urllib.request.Request(BASE+path, data=None if data is None else json.dumps(data).encode(),
                  method=method, headers={'Authorization':'Bearer '+TOKEN, 'Accept':'application/vnd.github+json',
                                         'Content-Type':'application/json','User-Agent':'foliage-artifact-publisher'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          request = urllib.request.Request(BASE+f'/actions/artifacts/{ARTIFACT}/zip',
              headers={'Authorization':'Bearer '+TOKEN, 'Accept':'application/vnd.github+json','User-Agent':'foliage-artifact-publisher'})
          try:
              urllib.request.build_opener(NoRedirect).open(request, timeout=60)
              raise RuntimeError('Expected GitHub artifact redirect')
          except urllib.error.HTTPError as error:
              if error.code != 302: raise
              signed = error.headers['Location']
          assert signed.startswith('https://')
          # No GitHub credential is sent to artifact storage.
          with urllib.request.urlopen(signed, timeout=120) as response:
              archive = response.read(100_000_001)
          assert len(archive) <= 100_000_000
          assert hashlib.sha256(archive).hexdigest() == DIGEST
          bundle = zipfile.ZipFile(io.BytesIO(archive))
          assert bundle.read('source-commit.txt').decode().strip() == SOURCE
          report = json.loads(bundle.read('runner-report.json'))
          assert report['images'] == 20
          # The known import-dialog failure remains recorded; do not waive capture errors.
          assert all(item['stage'] == 'import' for item in report['errors']), report
          for line in bundle.read('import.log').decode().splitlines():
              if 'ERROR:' in line:
                  assert 'Attempting to parent and popup a dialog that already has a parent.' in line
          capture = json.loads(bundle.read('images/foliage-review.json'))
          assert capture['status'] == 'captured' and not capture['errors']
          assert json.loads(bundle.read('glb-contract.json'))['status'] == 'passed'
          assert api('GET','/git/ref/heads/'+BRANCH)['object']['sha'] == HEAD
          parent = api('GET','/git/commits/'+HEAD)
          current = api('GET','/git/trees/'+parent['tree']['sha']+'?recursive=1')
          lookup = {entry['path']:entry.get('sha') for entry in current['tree']}
          assert not current.get('truncated')
          assert lookup['pool_godot_source.blend'] == '4518f92875134727a750cc39b1d570f3ad366983'
          assert lookup['godot/assets/backyard.glb'] == '71fd0241c3c2c1eeb69bd3bbc93bf6f67443b493'
          # Reject publication if authoring/runtime code changed after the inspected render.
          with tarfile.open(fileobj=io.BytesIO(bundle.read('source/source.tar'))) as sources:
              for item in sources.getmembers():
                  if item.isfile() and (item.name.startswith('godot/') or item.name == 'tools/build_anime_foliage.py'):
                      payload = sources.extractfile(item).read()
                      digest = hashlib.sha1(b'blob '+str(len(payload)).encode()+b'\0'+payload).hexdigest()
                      assert lookup.get(item.name) == digest, 'Source moved: '+item.name

          paths = {
              'assets/anime/courtyard_anime.glb':'godot/assets/anime/courtyard_anime.glb',
              'assets/anime/brush_atlas.png':'godot/assets/anime/brush_atlas.png',
              'assets/anime/build_manifest.json':'godot/assets/anime/build_manifest.json',
              'authoring/courtyard_anime.blend':'authoring/courtyard_anime.blend',
              'images/after-courtyard.png':'docs/previews/anime-courtyard.png',
              'images/after-trees.png':'docs/previews/anime-trees.png',
              'images/after-shrubs.png':'docs/previews/anime-shrubs.png',
          }
          entries=[]
          for source, destination in paths.items():
              payload=bundle.read(source)
              assert 0 < len(payload) <= 60_000_000
              blob=api('POST','/git/blobs',{'encoding':'base64','content':base64.b64encode(payload).decode()})
              entries.append({'path':destination,'mode':'100644','type':'blob','sha':blob['sha']})
          provenance={'artifact_id':ARTIFACT,'artifact_sha256':DIGEST,'rendered_source_commit':SOURCE,
                      'render_report':report,'artistic_acceptance':False,'main_modified':False}
          entries.append({'path':'godot/assets/anime/provenance.json','mode':'100644','type':'blob',
                          'content':json.dumps(provenance,indent=2)+'\n'})
          tree=api('POST','/git/trees',{'base_tree':parent['tree']['sha'],'tree':entries})
          commit=api('POST','/git/commits',{'message':'Publish inspected Blender foliage study, runtime assets and real Godot previews',
                                        'tree':tree['sha'],'parents':[HEAD]})
          assert api('GET','/git/ref/heads/'+BRANCH)['object']['sha'] == HEAD
          api('PATCH','/git/refs/heads/'+BRANCH,{'sha':commit['sha'],'force':False})
          print(json.dumps({'published_commit':commit['sha'],'paths':[e['path'] for e in entries],
                            'source_commit':SOURCE,'artifact_id':ARTIFACT,'main_modified':False},indent=2))
          PY
