name: Public compact-group tree first look
on:
  push:
    branches: [ci/yardscape-renderer-slice]
    paths: ['ci/yardscape-compact-tree-probe/**', '.github/workflows/yardscape-public-compact-tree.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compact-tree-${{ github.ref }}
  cancel-in-progress: true
jobs:
  look:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            ci/yardscape-renderer
            ci/yardscape-spatial-probe
            ci/yardscape-canopy-probe
            ci/yardscape-foliage-group-probe
            ci/yardscape-compact-tree-probe
      - name: Verify reviewed assembly boundary
        run: python ci/yardscape-compact-tree-probe/run_tree.py --verify-only
      - name: Install exact retained Godot
        run: python ci/yardscape-renderer/install_godot.py
      - name: Native first-look assembly
        run: python ci/yardscape-compact-tree-probe/run_tree.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compact-group-tree-first-look
          path: ${{ runner.temp }}/compact-tree-evidence
          retention-days: 7
          if-no-files-found: warn
